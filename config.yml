VERBOSE: True

MODEL:
  SESSION: 'Kligler'
  INPUT: 'input'
  TARGET: 'target'

OPTIM:
  BATCH_SIZE: 2
  NUM_EPOCHS: 150
  LR_INITIAL: 2e-4
  LR_MIN: 1e-6
  SEED: 3407
  WANDB: False

TRAINING:
  VAL_AFTER_EVERY: 1
  PS_W: 512
  PS_H: 512
  TRAIN_DIR: './dataset/RDD/train'
  VAL_DIR: './dataset/Kligler/test'
  SAVE_DIR: './checkpoints/RDD/models/base'
  ORI: False
  RESUME: './RDD_epoch_65.pth'
  NUM_WORKERS: 16
  VAL_BATCH_SIZE: 4
  VAL_NUM_WORKERS: 4
  PATIENCE: 25

LOSS:
  TYPE: 'CUSTOM'
  CONFIGS:
    CUSTOM:
      MSE_WEIGHT: 1.0
      SSIM_WEIGHT: 0.3      

TESTING:
  WEIGHT: "./checkpoints/Kligler/models/base/Kligler_epoch_43.pth"
  SAVE_IMAGES: True
  BATCH_SIZE: 1
  NUM_WORKERS: 4
